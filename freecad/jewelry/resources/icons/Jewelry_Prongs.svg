  <line x1="48" y1="46" x2="50" y2="22" stroke="#F39C12" stroke-width="4" stroke-linecap="round" />
  <line x1="24" y1="48" x2="22" y2="25" stroke="#F5B041" stroke-width="4" stroke-linecap="round" />
  <line x1="40" y1="48" x2="42" y2="25" stroke="#F5B041" stroke-width="4" stroke-linecap="round" />
